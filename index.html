<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#061b2b" />
    <meta
      name="description"
      content="A cinematic, game-inspired journey through the DSA Way and the Five Whys."
    />
    <meta property="og:title" content="The DSA Way: A Hero's Journey" />
    <meta
      property="og:description"
      content="A cinematic, game-inspired journey through the DSA Way and the Five Whys."

    <meta
      property="og:image"
      content="https://roshan-d-patel-8.github.io/dsa-way-hero-journey/og.png"

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The DSA Way: A Hero's Journey" />

      name="twitter:description"
      content="A cinematic, game-inspired journey through the DSA Way and the Five Whys."

      content="https://roshan-d-patel-8.github.io/dsa-way-hero-journey/og.png"

    <title>The DSA Way: A Hero's Journey</title>
    <style>
      html, body, #root { min-height: 100%; }
      body { margin: 0; background: #050d14; color: #eaf5f7; }
      .boot-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background:
          linear-gradient(90deg, rgba(143, 213, 232, .045) 1px, transparent 1px) 0 0 / 34px 34px,
          linear-gradient(rgba(143, 213, 232, .045) 1px, transparent 1px) 0 0 / 34px 34px,
          radial-gradient(circle at 50% 35%, rgba(48,181,230,.12), transparent 34%),
          #050d14;
        font-family: "Courier New", monospace;
        text-align: center;
      }
      .boot-card { max-width: 560px; }
      .boot-runes { color: #f08f24; font-size: 1.55rem; letter-spacing: .42em; }
      .boot-screen h1 { margin: 22px 0 12px; color: #30b5e6; font-size: clamp(2rem, 6vw, 4rem); text-shadow: 0 0 24px rgba(48,181,230,.35); }
      .boot-screen p { line-height: 1.6; }
      .boot-screen a, .boot-screen button {
        color: #fff;
        background: #102936;
        border: 0;
        display: inline-block;
        margin-top: 18px;
        padding: 13px 18px;
        font: inherit;
        cursor: pointer;
      }
      .boot-progress { display: block; color: #981f59; margin-top: 14px; font-size: .78rem; letter-spacing: .1em; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-screen" aria-live="polite">
        <div class="boot-card">
          <div class="boot-runes" aria-hidden="true">◇ ◇ ◇ ◇ ◇</div>
          <h1>The DSA Way</h1>
          <p>Loading the cinematic gateway…</p>
          <span class="boot-progress">THE TEXT QUEST WILL OPEN FIRST</span>
          <noscript><p>This quest needs JavaScript enabled to awaken the runes.</p></noscript>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
